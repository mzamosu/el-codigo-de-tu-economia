<svg width="1380" height="640" viewBox="0 0 690 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Estructura de un programa: Entrada, Procesamiento y Salida</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap');
  * { font-family:'Poppins','Segoe UI',Arial,sans-serif; }
</style>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#CBD5E1" stroke-width="1.8"/>
  </marker>
</defs>

<rect width="680" height="310" fill="#F8FAFC" rx="12"/>

<!-- Cabecera -->
<rect x="0" y="0" width="680" height="36" rx="12" fill="#1E3A5F"/>
<rect x="0" y="24" width="680" height="12" fill="#1E3A5F"/>
<text x="340" y="14" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:15px;font-weight:700;">Estructura de un programa</text>
<text x="340" y="28" text-anchor="middle" dominant-baseline="central" style="fill:#BAE6FD;font-size:10px;font-weight:600;">Ejemplo: Gestor de Gastos Personales</text>

<!-- ── ENTRADA ── -->
<rect x="20" y="48" width="190" height="168" rx="10" fill="#0891B2"/>
<rect x="20" y="48" width="190" height="40" rx="10" fill="rgba(0,0,0,0.18)"/>
<rect x="20" y="74" width="190" height="14" fill="rgba(0,0,0,0.18)"/>
<text x="115" y="62" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:14px;font-weight:700;">📥 Entrada</text>
<text x="115" y="78" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:10px;font-weight:600;opacity:0.85;">Input — el usuario introduce</text>

<rect x="32" y="100" width="166" height="22" rx="5" fill="rgba(0,0,0,0.20)"/>
<text x="115" y="111" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Importe del gasto</text>
<rect x="32" y="126" width="166" height="22" rx="5" fill="rgba(0,0,0,0.15)"/>
<text x="115" y="137" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Categoría del gasto</text>
<rect x="32" y="152" width="166" height="22" rx="5" fill="rgba(0,0,0,0.20)"/>
<text x="115" y="163" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Fecha del gasto</text>
<rect x="32" y="178" width="166" height="22" rx="5" fill="rgba(0,0,0,0.15)"/>
<text x="115" y="189" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Presupuesto mensual</text>

<!-- Flecha 1→2 -->
<line x1="210" y1="132" x2="238" y2="132" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arr)"/>

<!-- ── PROCESAMIENTO ── -->
<rect x="240" y="48" width="200" height="168" rx="10" fill="#7C3AED"/>
<rect x="240" y="48" width="200" height="40" rx="10" fill="rgba(0,0,0,0.18)"/>
<rect x="240" y="74" width="200" height="14" fill="rgba(0,0,0,0.18)"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:14px;font-weight:700;">⚙️ Procesamiento</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:10px;font-weight:600;opacity:0.85;">El programa calcula y decide</text>

<rect x="252" y="100" width="176" height="22" rx="5" fill="rgba(0,0,0,0.20)"/>
<text x="340" y="111" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Suma total de gastos</text>
<rect x="252" y="126" width="176" height="22" rx="5" fill="rgba(0,0,0,0.15)"/>
<text x="340" y="137" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Clasifica por categoría</text>
<rect x="252" y="152" width="176" height="22" rx="5" fill="rgba(0,0,0,0.20)"/>
<text x="340" y="163" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Compara con presupuesto</text>
<rect x="252" y="178" width="176" height="22" rx="5" fill="rgba(0,0,0,0.15)"/>
<text x="340" y="189" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Detecta si hay alerta</text>

<!-- Flecha 2→3 -->
<line x1="440" y1="132" x2="468" y2="132" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arr)"/>

<!-- ── SALIDA ── -->
<rect x="470" y="48" width="190" height="168" rx="10" fill="#DC2626"/>
<rect x="470" y="48" width="190" height="40" rx="10" fill="rgba(0,0,0,0.18)"/>
<rect x="470" y="74" width="190" height="14" fill="rgba(0,0,0,0.18)"/>
<text x="565" y="62" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:14px;font-weight:700;">📤 Salida</text>
<text x="565" y="78" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:10px;font-weight:600;opacity:0.85;">Output — el programa muestra</text>

<rect x="482" y="100" width="166" height="22" rx="5" fill="rgba(0,0,0,0.20)"/>
<text x="565" y="111" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Total gastado: 320 €</text>
<rect x="482" y="126" width="166" height="22" rx="5" fill="rgba(0,0,0,0.15)"/>
<text x="565" y="137" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Mayor gasto: alimentación</text>
<rect x="482" y="152" width="166" height="22" rx="5" fill="rgba(0,0,0,0.20)"/>
<text x="565" y="163" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Quedan: 180 € disponibles</text>
<rect x="482" y="178" width="166" height="22" rx="5" fill="rgba(0,0,0,0.15)"/>
<text x="565" y="189" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">⚠️ Ocio: límite superado</text>

<!-- Footer -->
<rect x="20" y="230" width="640" height="64" rx="10" fill="#1E3A5F"/>
<text x="340" y="250" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Todo programa, sea simple o complejo, sigue siempre este mismo esquema</text>
<text x="340" y="270" text-anchor="middle" dominant-baseline="central" style="fill:#94A3B8;font-size:10px;font-weight:400;">La estructura Entrada → Procesamiento → Salida es universal en programación</text>
<text font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#67E8F9" x="340" y="286" text-anchor="middle" dominant-baseline="central">input()  →  lógica del programa  →  print()</text>
</svg>
