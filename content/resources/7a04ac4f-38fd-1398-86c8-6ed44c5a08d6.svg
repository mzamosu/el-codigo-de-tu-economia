<svg width="1360" height="600" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Operadores lógicos en Python: and, or, not</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap');
  * { font-family:'Poppins','Segoe UI',Arial,sans-serif; }
</style>

<rect width="680" height="300" fill="#F8FAFC" rx="12"/>
<rect x="0" y="0" width="680" height="36" rx="12" fill="#1E3A5F"/>
<rect x="0" y="24" width="680" height="12" fill="#1E3A5F"/>
<text x="340" y="18" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:15px;font-weight:700;">Operadores lógicos en Python</text>

<!-- AND -->
<rect x="30" y="46" width="190" height="110" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="125" y="68" text-anchor="middle" dominant-baseline="central" style="fill:#085041;font-family:'Courier New',monospace;font-size:16px;font-weight:700;">and</text>
<text x="125" y="88" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56;font-size:12px;font-weight:400;">Ambas condiciones</text>
<text x="125" y="104" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56;font-size:12px;font-weight:400;">deben ser True</text>
<rect x="46" y="116" width="158" height="24" rx="4" fill="#0F6E56" opacity="0.10"/>
<text x="125" y="128" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-family:'Courier New',monospace;font-size:10px;">True and True → True</text>
<text x="125" y="148" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56;font-size:12px;font-weight:400;opacity:0.6;">True and False → False</text>

<!-- OR -->
<rect x="245" y="46" width="190" height="110" rx="8" fill="#EEEEFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489;font-family:'Courier New',monospace;font-size:16px;font-weight:700;">or</text>
<text x="340" y="88" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7;font-size:12px;font-weight:400;">Al menos una condición</text>
<text x="340" y="104" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7;font-size:12px;font-weight:400;">debe ser True</text>
<rect x="261" y="116" width="158" height="24" rx="4" fill="#534AB7" opacity="0.10"/>
<text x="340" y="128" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-family:'Courier New',monospace;font-size:10px;">True or False → True</text>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" style="fill:#534AB7;font-size:12px;font-weight:400;opacity:0.6;">False or False → False</text>

<!-- NOT -->
<rect x="460" y="46" width="190" height="110" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="555" y="68" text-anchor="middle" dominant-baseline="central" style="fill:#712B13;font-family:'Courier New',monospace;font-size:16px;font-weight:700;">not</text>
<text x="555" y="88" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D;font-size:12px;font-weight:400;">Invierte el resultado</text>
<text x="555" y="104" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D;font-size:12px;font-weight:400;">de la condición</text>
<rect x="476" y="116" width="158" height="24" rx="4" fill="#993C1D" opacity="0.10"/>
<text x="555" y="128" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-family:'Courier New',monospace;font-size:10px;">not True → False</text>
<text x="555" y="148" text-anchor="middle" dominant-baseline="central" style="fill:#993C1D;font-size:12px;font-weight:400;opacity:0.6;">not False → True</text>

<!-- Ejemplos con el Gestor -->
<rect x="30" y="170" width="620" height="118" rx="8" fill="#1E3A5F" opacity="0.05"/>
<text x="50" y="188" dominant-baseline="central" style="fill:#1E3A5F;font-size:11px;font-weight:600;opacity:0.8;">Ejemplos con el Gestor de Gastos  (presupuesto=500, total=480, categoria="ocio", importe=60)</text>

<rect x="40" y="200" width="600" height="22" rx="3" fill="#059669" opacity="0.10"/>
<text x="50" y="211" dominant-baseline="central" style="fill:#0F172A;font-family:'Courier New',monospace;font-size:11px;">categoria == "ocio" and importe &gt; 50</text>
<text x="390" y="211" dominant-baseline="central" style="fill:#475569;font-family:'Courier New',monospace;font-size:11px;">→ True and True</text>
<text x="560" y="211" dominant-baseline="central" style="fill:#059669;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">→ True</text>

<rect x="40" y="225" width="600" height="22" rx="3" fill="#7C3AED" opacity="0.08"/>
<text x="50" y="236" dominant-baseline="central" style="fill:#0F172A;font-family:'Courier New',monospace;font-size:11px;">total &gt; 500 or importe &gt; 50</text>
<text x="390" y="236" dominant-baseline="central" style="fill:#475569;font-family:'Courier New',monospace;font-size:11px;">→ False or True</text>
<text x="560" y="236" dominant-baseline="central" style="fill:#7C3AED;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">→ True</text>

<rect x="40" y="250" width="600" height="22" rx="3" fill="#DC2626" opacity="0.08"/>
<text x="50" y="261" dominant-baseline="central" style="fill:#0F172A;font-family:'Courier New',monospace;font-size:11px;">not (total &gt; presupuesto)</text>
<text x="390" y="261" dominant-baseline="central" style="fill:#475569;font-family:'Courier New',monospace;font-size:11px;">→ not False</text>
<text x="560" y="261" dominant-baseline="central" style="fill:#059669;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">→ True</text>
</svg>
