<svg width="1380" height="820" viewBox="0 0 690 410" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Funcionamiento de break y continue en Python</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap');
  * { font-family:'Poppins','Segoe UI',Arial,sans-serif; }
</style>
<defs>
  <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#DC2626" stroke-width="2"/>
  </marker>
  <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#D97706" stroke-width="2"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="2"/>
  </marker>
</defs>

<rect width="680" height="400" fill="#F8FAFC" rx="12"/>
<rect x="0" y="0" width="680" height="36" rx="12" fill="#1E3A5F"/>
<rect x="0" y="24" width="680" height="12" fill="#1E3A5F"/>
<text x="340" y="14" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:15px;font-weight:700;">break y continue en Python</text>
<text x="340" y="28" text-anchor="middle" dominant-baseline="central" style="fill:#BAE6FD;font-size:10px;font-weight:600;">Dos herramientas para controlar el flujo de un bucle</text>

<!-- Separador central -->
<line x1="340" y1="36" x2="340" y2="328" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>

<!-- ══════ COL BREAK ══════ -->
<rect x="20" y="44" width="306" height="26" rx="6" fill="#DC2626"/>
<text x="173" y="57" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:13px;font-weight:700;">🛑 break — Sale del bucle</text>

<ellipse cx="173" cy="90" rx="30" ry="13" fill="#1E3A5F"/>
<text x="173" y="90" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">INICIO</text>
<line x1="173" y1="103" x2="173" y2="116" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- Condición bucle BREAK -->
<polygon points="173,116 218,138 173,160 128,138" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text fill="#DC2626" x="173" y="134" text-anchor="middle" dominant-baseline="central" style="font-size:10px;font-weight:700;">¿condición</text>
<text fill="#DC2626" x="173" y="147" text-anchor="middle" dominant-baseline="central" style="font-size:10px;font-weight:700;">bucle?</text>

<line x1="173" y1="160" x2="173" y2="173" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
<text fill="#059669" x="188" y="169" dominant-baseline="central" style="font-size:10px;font-weight:700;">Sí</text>

<!-- Instrucciones BREAK -->
<rect x="113" y="173" width="120" height="28" rx="6" fill="#1E3A5F"/>
<text x="173" y="187" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Instrucciones</text>
<line x1="173" y1="201" x2="173" y2="214" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- Condición break -->
<polygon points="173,214 218,236 173,258 128,236" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<text fill="#DC2626" x="173" y="232" text-anchor="middle" dominant-baseline="central" style="font-size:10px;font-weight:700;">¿break?</text>

<!-- Sí break → SALE -->
<line x1="218" y1="236" x2="290" y2="236" stroke="#DC2626" stroke-width="2" marker-end="url(#ab)"/>
<text fill="#DC2626" x="228" y="228" dominant-baseline="central" style="font-size:10px;font-weight:700;">Sí</text>
<ellipse cx="315" cy="236" rx="22" ry="12" fill="#DC2626"/>
<text x="315" y="236" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:9px;font-weight:700;">SALE</text>

<!-- No break → vuelve al inicio -->
<line x1="173" y1="258" x2="173" y2="275" stroke="#475569" stroke-width="1.5"/>
<text fill="#475569" x="188" y="267" dominant-baseline="central" style="font-size:10px;font-weight:700;">No</text>
<line x1="173" y1="275" x2="56" y2="275" stroke="#475569" stroke-width="1.5"/>
<line x1="56" y1="275" x2="56" y2="152" stroke="#475569" stroke-width="1.5"/>
<line x1="56" y1="152" x2="128" y2="152" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
<text fill="#475569" x="60" y="112" dominant-baseline="central" style="font-size:9px;font-weight:600;fill:#475569;">vuelve</text>

<!-- No condición bucle → FIN BUCLE BREAK -->
<line x1="128" y1="138" x2="28" y2="138" stroke="#475569" stroke-width="1.5"/>
<line x1="28" y1="138" x2="28" y2="295" stroke="#475569" stroke-width="1.5"/>
<line x1="28" y1="295" x2="143" y2="295" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
<text fill="#475569" x="32" y="128" dominant-baseline="central" style="font-size:10px;font-weight:700;">No</text>

<ellipse cx="173" cy="295" rx="30" ry="13" fill="#1E3A5F"/>
<text x="173" y="295" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">FIN BUCLE</text>

<!-- ══════ COL CONTINUE ══════ -->
<rect x="354" y="44" width="306" height="26" rx="6" fill="#D97706"/>
<text x="507" y="57" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:13px;font-weight:700;">⏭️ continue — Salta iteración</text>

<ellipse cx="507" cy="90" rx="30" ry="13" fill="#1E3A5F"/>
<text x="507" y="90" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">INICIO</text>
<line x1="507" y1="103" x2="507" y2="116" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- Condición bucle CONTINUE -->
<polygon points="507,116 552,138 507,160 462,138" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text fill="#92400E" x="507" y="134" text-anchor="middle" dominant-baseline="central" style="font-size:10px;font-weight:700;">¿condición</text>
<text fill="#92400E" x="507" y="147" text-anchor="middle" dominant-baseline="central" style="font-size:10px;font-weight:700;">bucle?</text>

<line x1="507" y1="160" x2="507" y2="173" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
<text fill="#059669" x="520" y="169" dominant-baseline="central" style="font-size:10px;font-weight:700;">Sí</text>

<!-- Instrucciones CONTINUE -->
<rect x="447" y="173" width="120" height="28" rx="6" fill="#1E3A5F"/>
<text x="507" y="187" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Instrucciones</text>
<line x1="507" y1="201" x2="507" y2="214" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- Condición continue -->
<polygon points="507,214 552,236 507,258 462,236" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text fill="#92400E" x="507" y="232" text-anchor="middle" dominant-baseline="central" style="font-size:10px;font-weight:700;">¿continue?</text>

<!-- Sí continue → salta vuelve al inicio del bucle -->
<line x1="552" y1="236" x2="630" y2="236" stroke="#D97706" stroke-width="2"/>
<line x1="630" y1="236" x2="630" y2="138" stroke="#D97706" stroke-width="2"/>
<line x1="630" y1="138" x2="552" y2="138" stroke="#D97706" stroke-width="2" marker-end="url(#ac)"/>
<text fill="#D97706" x="557" y="228" dominant-baseline="central" style="font-size:10px;font-weight:700;">Sí</text>
<text x="648" y="190" text-anchor="middle" dominant-baseline="central" transform="rotate(90,648,190)" style="fill:#475569;font-size:10px;font-weight:600;">vuelve al inicio</text>

<!-- No continue → Resto de instrucciones -->
<line x1="507" y1="258" x2="507" y2="272" stroke="#475569" stroke-width="1.5"/>
<text fill="#475569" x="520" y="267" dominant-baseline="central" style="font-size:10px;font-weight:700;">No</text>

<!-- Caja verde Resto instruc. -->
<rect x="447" y="272" width="120" height="28" rx="6" fill="#059669"/>
<text x="507" y="286" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Resto instruc.</text>

<!-- Loop back al inicio del bucle — entra al rombo en y=152 (debajo del vértice) -->
<line x1="447" y1="286" x2="390" y2="286" stroke="#475569" stroke-width="1.5"/>
<line x1="390" y1="286" x2="390" y2="152" stroke="#475569" stroke-width="1.5"/>
<line x1="390" y1="152" x2="462" y2="152" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
<text fill="#475569" x="394" y="112" dominant-baseline="central" style="font-size:9px;font-weight:600;fill:#475569;">vuelve</text>

<!-- No condición bucle → FIN BUCLE CONTINUE — sale del vértice exacto en y=138 -->
<line x1="462" y1="138" x2="372" y2="138" stroke="#475569" stroke-width="1.5"/>
<line x1="372" y1="138" x2="372" y2="318" stroke="#475569" stroke-width="1.5"/>
<line x1="372" y1="318" x2="465" y2="318" stroke="#475569" stroke-width="1.5" marker-end="url(#ag)"/>
<text fill="#475569" x="358" y="128" dominant-baseline="central" style="font-size:10px;font-weight:700;">No</text>

<ellipse cx="507" cy="318" rx="30" ry="13" fill="#1E3A5F"/>
<text x="507" y="318" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">FIN BUCLE</text>

<!-- Footer -->
<rect x="20" y="340" width="640" height="50" rx="10" fill="#1E3A5F"/>
<text x="340" y="356" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Diferencia clave</text>
<rect x="30" y="366" width="300" height="18" rx="6" fill="rgba(220,38,38,0.25)"/>
<text x="180" y="375" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-family:'Courier New',monospace;font-size:10px;font-weight:700;">break → Sale completamente del bucle</text>
<rect x="350" y="366" width="300" height="18" rx="6" fill="rgba(217,119,6,0.25)"/>
<text x="500" y="375" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-family:'Courier New',monospace;font-size:10px;font-weight:700;">continue → Salta solo la iteración actual</text>
</svg>
