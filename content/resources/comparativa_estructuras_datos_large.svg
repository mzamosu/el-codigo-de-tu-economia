<text x="577" y="172" text-anchor="middle" dominant-baseline="central" style="fill:#4ADE80;font-size:11px;font-weight:700;">✔ Sí</text>
<rect x="506" y="184" width="142" height="20" rx="4" fill="rgba(0,0,0,0.20)"/>
<text x="577" y="194" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">¿Duplicados?</text>
<text x="577" y="214" text-anchor="middle" dominant-baseline="central" style="fill:#F87171;font-size:11px;font-weight:700;">✘ No permite</text>
<rect x="506" y="228" width="142" height="32" rx="5" fill="rgba(0,0,0,0.28)"/>
<text x="577" y="240" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-family:'Courier New',monospace;font-size:10px;font-weight:700;">{"comida",</text>
<text x="577" y="253" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-family:'Courier New',monospace;font-size:10px;font-weight:700;"> "ocio", "casa"}</text>

