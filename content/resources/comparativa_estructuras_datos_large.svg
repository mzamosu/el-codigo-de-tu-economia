<svg width="1380" height="800" viewBox="0 0 690 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Estructuras de datos en Python: lista, tupla, diccionario y conjunto</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap');
  * { font-family:'Poppins','Segoe UI',Arial,sans-serif; }
</style>

<rect width="680" height="390" fill="#F8FAFC" rx="12"/>
<rect x="0" y="0" width="680" height="36" rx="12" fill="#1E3A5F"/>
<rect x="0" y="24" width="680" height="12" fill="#1E3A5F"/>
<text x="340" y="14" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:15px;font-weight:700;">Estructuras de datos en Python</text>
<text x="340" y="28" text-anchor="middle" dominant-baseline="central" style="fill:#BAE6FD;font-size:10px;font-weight:600;">Cuatro contenedores, cuatro situaciones distintas</text>

<!-- ── CARD Lista ── -->
<rect x="20" y="46" width="148" height="222" rx="10" fill="#0891B2"/>
<rect x="20" y="46" width="148" height="42" rx="10" fill="rgba(0,0,0,0.18)"/>
<rect x="20" y="74" width="148" height="14" fill="rgba(0,0,0,0.18)"/>
<text x="94" y="62" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:13px;font-weight:700;">[ ] Lista</text>
<text x="94" y="79" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:10px;font-weight:600;opacity:0.85;">list</text>
<rect x="32" y="100" width="124" height="20" rx="4" fill="rgba(0,0,0,0.20)"/>
<text x="94" y="110" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">¿Ordenada?</text>
<text x="94" y="130" text-anchor="middle" dominant-baseline="central" style="fill:#4ADE80;font-size:11px;font-weight:700;">✔ Sí</text>
<rect x="32" y="142" width="124" height="20" rx="4" fill="rgba(0,0,0,0.20)"/>
<text x="94" y="152" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">¿Modificable?</text>
<text x="94" y="172" text-anchor="middle" dominant-baseline="central" style="fill:#4ADE80;font-size:11px;font-weight:700;">✔ Sí</text>
<rect x="32" y="184" width="124" height="20" rx="4" fill="rgba(0,0,0,0.20)"/>
<text x="94" y="194" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">¿Duplicados?</text>
<text x="94" y="214" text-anchor="middle" dominant-baseline="central" style="fill:#4ADE80;font-size:11px;font-weight:700;">✔ Permite</text>
<rect x="32" y="228" width="124" height="32" rx="5" fill="rgba(0,0,0,0.28)"/>
<text x="94" y="240" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-family:'Courier New',monospace;font-size:10px;font-weight:700;">[45.5, 32.0,</text>
<text x="94" y="253" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-family:'Courier New',monospace;font-size:10px;font-weight:700;"> 18.75, 45.5]</text>

<!-- ── CARD Tupla ── -->
<rect x="178" y="46" width="148" height="222" rx="10" fill="#7C3AED"/>
<rect x="178" y="46" width="148" height="42" rx="10" fill="rgba(0,0,0,0.18)"/>
<rect x="178" y="74" width="148" height="14" fill="rgba(0,0,0,0.18)"/>
<text x="252" y="62" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:13px;font-weight:700;">( ) Tupla</text>
<text x="252" y="79" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:10px;font-weight:600;opacity:0.85;">tuple</text>
<rect x="190" y="100" width="124" height="20" rx="4" fill="rgba(0,0,0,0.20)"/>
<text x="252" y="110" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">¿Ordenada?</text>
<text x="252" y="130" text-anchor="middle" dominant-baseline="central" style="fill:#4ADE80;font-size:11px;font-weight:700;">✔ Sí</text>
<rect x="190" y="142" width="124" height="20" rx="4" fill="rgba(0,0,0,0.20)"/>
<text x="252" y="152" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">¿Modificable?</text>
<text x="252" y="172" text-anchor="middle" dominant-baseline="central" style="fill:#F87171;font-size:11px;font-weight:700;">✘ No</text>
<rect x="190" y="184" width="124" height="20" rx="4" fill="rgba(0,0,0,0.20)"/>
<text x="252" y="194" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">¿Duplicados?</text>
<text x="252" y="214" text-anchor="middle" dominant-baseline="central" style="fill:#4ADE80;font-size:11px;font-weight:700;">✔ Permite</text>
<rect x="190" y="228" width="124" height="32" rx="5" fill="rgba(0,0,0,0.28)"/>
<text x="252" y="240" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-family:'Courier New',monospace;font-size:10px;font-weight:700;">("comida",</text>
<text x="252" y="253" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-family:'Courier New',monospace;font-size:10px;font-weight:700;"> "ocio", "casa")</text>

<!-- ── CARD Diccionario ── -->
<rect x="336" y="46" width="148" height="222" rx="10" fill="#D97706"/>
<rect x="336" y="46" width="148" height="42" rx="10" fill="rgba(0,0,0,0.18)"/>
<rect x="336" y="74" width="148" height="14" fill="rgba(0,0,0,0.18)"/>
<text x="410" y="62" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:13px;font-weight:700;">{k:v} Dict</text>
<text x="410" y="79" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:10px;font-weight:600;opacity:0.85;">dict</text>
<rect x="348" y="100" width="124" height="20" rx="4" fill="rgba(0,0,0,0.20)"/>
<text x="410" y="110" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">¿Ordenada?</text>
<text x="410" y="130" text-anchor="middle" dominant-baseline="central" style="fill:#4ADE80;font-size:11px;font-weight:700;">✔ Sí (Python 3.7+)</text>
<rect x="348" y="142" width="124" height="20" rx="4" fill="rgba(0,0,0,0.20)"/>
<text x="410" y="152" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">¿Modificable?</text>
<text x="410" y="172" text-anchor="middle" dominant-baseline="central" style="fill:#4ADE80;font-size:11px;font-weight:700;">✔ Sí</text>
<rect x="348" y="184" width="124" height="20" rx="4" fill="rgba(0,0,0,0.20)"/>
<text x="410" y="194" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">¿Duplicados?</text>
<text x="410" y="214" text-anchor="middle" dominant-baseline="central" style="fill:#F87171;font-size:11px;font-weight:700;">✘ Claves únicas</text>
<rect x="348" y="228" width="124" height="32" rx="5" fill="rgba(0,0,0,0.28)"/>
<text x="410" y="240" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-family:'Courier New',monospace;font-size:10px;font-weight:700;">{"comida":120,</text>
<text x="410" y="253" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-family:'Courier New',monospace;font-size:10px;font-weight:700;"> "ocio": 80}</text>

