<text x="213" y="136" text-anchor="middle" dominant-baseline="central" style="fill:#E0F2FE;font-size:10px;font-weight:400;">Web, IA, datos,</text>
<text x="213" y="150" text-anchor="middle" dominant-baseline="central" style="fill:#E0F2FE;font-size:10px;font-weight:400;">scripts y más</text>

<!-- Card 3: Gratuito -->
<rect x="284" y="50" width="122" height="110" rx="10" fill="#059669"/>
<text font-size="28" x="345" y="90" text-anchor="middle" dominant-baseline="central">🆓</text>
<text x="345" y="118" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:13px;font-weight:700;">Gratuito</text>
<text x="345" y="136" text-anchor="middle" dominant-baseline="central" style="fill:#E0F2FE;font-size:10px;font-weight:400;">Libre de usar</text>
<text x="345" y="150" text-anchor="middle" dominant-baseline="central" style="fill:#E0F2FE;font-size:10px;font-weight:400;">y modificar</text>

<!-- Card 4: Comunidad -->
<rect x="416" y="50" width="122" height="110" rx="10" fill="#D97706"/>
<text font-size="28" x="477" y="90" text-anchor="middle" dominant-baseline="central">👥</text>
<text x="477" y="118" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:13px;font-weight:700;">Comunidad</text>
<text x="477" y="136" text-anchor="middle" dominant-baseline="central" style="fill:#E0F2FE;font-size:10px;font-weight:400;">Millones de</text>
<text x="477" y="150" text-anchor="middle" dominant-baseline="central" style="fill:#E0F2FE;font-size:10px;font-weight:400;">usuarios y recursos</text>

<!-- Card 5: Demandado -->
<rect x="548" y="50" width="112" height="110" rx="10" fill="#DC2626"/>
