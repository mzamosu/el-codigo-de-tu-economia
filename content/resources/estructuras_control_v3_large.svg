<svg width="1380" height="730" viewBox="0 0 690 365" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>De la secuencia a las estructuras de control</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap');
  * { font-family:'Poppins','Segoe UI',Arial,sans-serif; }
</style>
<defs>
  <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#0891B2" stroke-width="2"/>
  </marker>
  <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#7C3AED" stroke-width="2"/>
  </marker>
  <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#1E3A5F" stroke-width="2"/>
  </marker>
</defs>

<rect width="680" height="355" fill="#F8FAFC" rx="12"/>
<rect x="0" y="0" width="680" height="36" rx="12" fill="#1E3A5F"/>
<rect x="0" y="24" width="680" height="12" fill="#1E3A5F"/>
<text x="340" y="14" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:14px;font-weight:700;">De la secuencia a las estructuras de control</text>
<text x="340" y="28" text-anchor="middle" dominant-baseline="central" style="fill:#BAE6FD;font-size:10px;font-weight:600;">Las estructuras de control modifican el flujo secuencial natural de un programa</text>

<!-- Separadores -->
<line x1="227" y1="36" x2="227" y2="300" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="453" y1="36" x2="453" y2="300" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>

<!-- ══ COL 1: SECUENCIA ══ -->
<rect x="10" y="40" width="212" height="24" rx="6" fill="#0891B2"/>
<text x="116" y="52" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">📋 Secuencia</text>
<text x="116" y="72" text-anchor="middle" style="fill:#64748B;font-size:9px;font-weight:600;font-style:italic;">Flujo natural — sin estructuras de control</text>

<ellipse cx="116" cy="86" rx="24" ry="12" fill="#0891B2"/>
<text x="116" y="86" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:9px;font-weight:700;">INICIO</text>
<line x1="116" y1="98" x2="116" y2="112" stroke="#0891B2" stroke-width="2" marker-end="url(#a1)"/>
<rect x="76" y="112" width="80" height="32" rx="6" fill="#0891B2"/>
<text x="116" y="128" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:15px;font-weight:700;">A</text>
<line x1="116" y1="144" x2="116" y2="158" stroke="#0891B2" stroke-width="2" marker-end="url(#a1)"/>
<rect x="76" y="158" width="80" height="32" rx="6" fill="#0891B2"/>
<text x="116" y="174" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:15px;font-weight:700;">B</text>
<line x1="116" y1="190" x2="116" y2="204" stroke="#0891B2" stroke-width="2" marker-end="url(#a1)"/>
<ellipse cx="116" cy="216" rx="24" ry="12" fill="#1E3A5F"/>
<text x="116" y="216" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:9px;font-weight:700;">FIN</text>
<text x="116" y="244" text-anchor="middle" style="fill:#475569;font-size:10px;font-weight:600;">Las instrucciones se ejecutan</text>
<text x="116" y="258" text-anchor="middle" style="fill:#475569;font-size:10px;font-weight:600;">siempre en el mismo orden</text>
<text x="116" y="272" text-anchor="middle" style="fill:#475569;font-size:10px;font-weight:600;">de arriba a abajo</text>

<!-- ══ COL 2: CONDICIONAL ══ -->
<rect x="233" y="40" width="214" height="24" rx="6" fill="#7C3AED"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">🔀 Condicional (if / else)</text>
<text x="340" y="72" text-anchor="middle" style="fill:#64748B;font-size:9px;font-weight:600;font-style:italic;">Estructura de control — elige un camino</text>

<ellipse cx="340" cy="86" rx="24" ry="12" fill="#7C3AED"/>
<text x="340" y="86" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:9px;font-weight:700;">INICIO</text>
<line x1="340" y1="98" x2="340" y2="112" stroke="#7C3AED" stroke-width="2" marker-end="url(#a2)"/>
<polygon points="340,112 385,138 340,164 295,138" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text fill="#4C1D95" x="340" y="138" text-anchor="middle" dominant-baseline="central" style="font-size:10px;font-weight:700;">¿condición?</text>

<!-- Sí izq -->
<line x1="295" y1="138" x2="264" y2="138" stroke="#7C3AED" stroke-width="2"/>
<line x1="264" y1="138" x2="264" y2="172" stroke="#7C3AED" stroke-width="2" marker-end="url(#a2)"/>
<text fill="#059669" x="276" y="130" text-anchor="middle" style="font-size:10px;font-weight:700;">Sí</text>
<rect x="229" y="172" width="70" height="32" rx="6" fill="#7C3AED"/>
<text x="264" y="188" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:15px;font-weight:700;">A</text>

<!-- No der -->
<line x1="385" y1="138" x2="416" y2="138" stroke="#7C3AED" stroke-width="2"/>
<line x1="416" y1="138" x2="416" y2="172" stroke="#7C3AED" stroke-width="2" marker-end="url(#a2)"/>
<text fill="#DC2626" x="404" y="130" text-anchor="middle" style="font-size:10px;font-weight:700;">No</text>
<rect x="381" y="172" width="70" height="32" rx="6" fill="#7C3AED"/>
<text x="416" y="188" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:15px;font-weight:700;">B</text>

<!-- Merge -->
<line x1="264" y1="204" x2="264" y2="224" stroke="#7C3AED" stroke-width="2"/>
<line x1="416" y1="204" x2="416" y2="224" stroke="#7C3AED" stroke-width="2"/>
<line x1="264" y1="224" x2="416" y2="224" stroke="#7C3AED" stroke-width="2"/>
<line x1="340" y1="224" x2="340" y2="238" stroke="#7C3AED" stroke-width="2" marker-end="url(#a2)"/>
<ellipse cx="340" cy="250" rx="24" ry="12" fill="#1E3A5F"/>
<text x="340" y="250" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:9px;font-weight:700;">FIN</text>
<text x="340" y="272" text-anchor="middle" style="fill:#475569;font-size:10px;font-weight:600;">El programa elige un camino</text>
<text x="340" y="286" text-anchor="middle" style="fill:#475569;font-size:10px;font-weight:600;">según si se cumple la condición</text>

<!-- ══ COL 3: BUCLE ══ -->
<rect x="459" y="40" width="211" height="24" rx="6" fill="#1E3A5F"/>
<text x="564" y="52" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">🔁 Bucle (for / while)</text>
<text x="564" y="72" text-anchor="middle" style="fill:#64748B;font-size:9px;font-weight:600;font-style:italic;">Estructura de control — repite acciones</text>

<ellipse cx="564" cy="86" rx="24" ry="12" fill="#1E3A5F"/>
<text x="564" y="86" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:9px;font-weight:700;">INICIO</text>
<line x1="564" y1="98" x2="564" y2="112" stroke="#1E3A5F" stroke-width="2" marker-end="url(#a3)"/>
<rect x="524" y="112" width="80" height="32" rx="6" fill="#1E3A5F"/>
<text x="564" y="128" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:15px;font-weight:700;">A</text>
<line x1="564" y1="144" x2="564" y2="158" stroke="#1E3A5F" stroke-width="2" marker-end="url(#a3)"/>
<polygon points="564,158 609,184 564,210 519,184" fill="#E0E7FF" stroke="#1E3A5F" stroke-width="2"/>
<text fill="#1E3A5F" x="564" y="184" text-anchor="middle" dominant-baseline="central" style="font-size:10px;font-weight:700;">¿condición?</text>

<!-- Sí loop -->
<line x1="519" y1="184" x2="490" y2="184" stroke="#1E3A5F" stroke-width="2"/>
<line x1="490" y1="184" x2="490" y2="128" stroke="#1E3A5F" stroke-width="2"/>
<line x1="490" y1="128" x2="524" y2="128" stroke="#1E3A5F" stroke-width="2" marker-end="url(#a3)"/>
<text fill="#059669" x="502" y="157" text-anchor="middle" style="font-size:10px;font-weight:700;">Sí</text>

<!-- No exit -->
<line x1="564" y1="210" x2="564" y2="238" stroke="#1E3A5F" stroke-width="2" marker-end="url(#a3)"/>
<text fill="#DC2626" x="582" y="226" text-anchor="middle" style="font-size:10px;font-weight:700;">No</text>
<ellipse cx="564" cy="250" rx="24" ry="12" fill="#1E3A5F"/>
<text x="564" y="250" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:9px;font-weight:700;">FIN</text>
<text x="564" y="272" text-anchor="middle" style="fill:#475569;font-size:10px;font-weight:600;">El programa repite mientras</text>
<text x="564" y="286" text-anchor="middle" style="fill:#475569;font-size:10px;font-weight:600;">la condición sea verdadera</text>

<!-- Footer -->
<rect x="10" y="300" width="660" height="46" rx="8" fill="#1E3A5F"/>
<!-- Separadores verticales -->
<line x1="230" y1="304" x2="230" y2="342" stroke="#334155" stroke-width="1"/>
<line x1="450" y1="304" x2="450" y2="342" stroke="#334155" stroke-width="1"/>
<!-- Columna 1: Secuencia -->
<text x="120" y="318" text-anchor="middle" style="fill:#FFFFFF;font-size:10px;font-weight:600;">Flujo por defecto</text>
<text x="120" y="334" text-anchor="middle" style="fill:#67E8F9;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">A → B → C</text>
<!-- Columna 2: Condicionales -->
<text x="340" y="318" text-anchor="middle" style="fill:#FFFFFF;font-size:10px;font-weight:600;">Condicionales</text>
<text x="340" y="334" text-anchor="middle" style="fill:#67E8F9;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">if / elif / else</text>
<!-- Columna 3: Bucles -->
<text x="560" y="318" text-anchor="middle" style="fill:#FFFFFF;font-size:10px;font-weight:600;">Bucles</text>
<text x="560" y="334" text-anchor="middle" style="fill:#67E8F9;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">for / while</text>
</svg>
