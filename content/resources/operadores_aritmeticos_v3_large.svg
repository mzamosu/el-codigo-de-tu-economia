<svg width="1380" height="664" viewBox="0 0 690 332" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Operadores aritméticos en Python</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap');
  * { font-family:'Poppins','Segoe UI',Arial,sans-serif; }
</style>

<rect width="680" height="322" fill="#F8FAFC" rx="12"/>
<rect x="0" y="0" width="680" height="36" rx="12" fill="#1E3A5F"/>
<rect x="0" y="24" width="680" height="12" fill="#1E3A5F"/>
<text x="340" y="18" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:15px;font-weight:700;">Operadores aritméticos en Python</text>

<!-- Cabecera columnas -->
<rect x="20" y="44" width="70" height="26" rx="6" fill="#0891B2"/>
<rect x="98" y="44" width="130" height="26" rx="6" fill="#0891B2"/>
<rect x="236" y="44" width="190" height="26" rx="6" fill="#0891B2"/>
<rect x="434" y="44" width="226" height="26" rx="6" fill="#0891B2"/>
<text x="55" y="57" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:12px;font-weight:700;">Op.</text>
<text x="163" y="57" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:12px;font-weight:700;">Nombre</text>
<text x="331" y="57" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:12px;font-weight:700;">Ejemplo</text>
<text x="547" y="57" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:12px;font-weight:700;">Uso en el Gestor</text>

<!-- Fila + -->
<rect x="20" y="74" width="640" height="28" rx="4" fill="#E0F2FE"/>
<text x="55" y="88" text-anchor="middle" dominant-baseline="central" style="fill:#0891B2;font-family:'Courier New',monospace;font-size:18px;font-weight:700;">+</text>
<text x="163" y="88" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">Suma</text>
<text x="331" y="88" text-anchor="middle" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">total + importe</text>
<text x="547" y="88" text-anchor="middle" dominant-baseline="central" style="fill:#334155;font-size:11px;font-weight:600;">Acumular gastos</text>

<!-- Fila - -->
<rect x="20" y="106" width="640" height="28" rx="4" fill="#FFFFFF"/>
<text x="55" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#0891B2;font-family:'Courier New',monospace;font-size:18px;font-weight:700;">-</text>
<text x="163" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">Resta</text>
<text x="331" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">presupuesto - total</text>
<text x="547" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#334155;font-size:11px;font-weight:600;">Calcular saldo restante</text>

<!-- Fila * -->
<rect x="20" y="138" width="640" height="28" rx="4" fill="#E0F2FE"/>
<text x="55" y="152" text-anchor="middle" dominant-baseline="central" style="fill:#0891B2;font-family:'Courier New',monospace;font-size:18px;font-weight:700;">*</text>
<text x="163" y="152" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">Multiplicación</text>
<text x="331" y="152" text-anchor="middle" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">importe * cantidad</text>
<text x="547" y="152" text-anchor="middle" dominant-baseline="central" style="fill:#334155;font-size:11px;font-weight:600;">Calcular gasto repetido</text>

<!-- Fila / -->
<rect x="20" y="170" width="640" height="28" rx="4" fill="#FFFFFF"/>
<text x="55" y="184" text-anchor="middle" dominant-baseline="central" style="fill:#0891B2;font-family:'Courier New',monospace;font-size:18px;font-weight:700;">/</text>
<text x="163" y="184" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">División</text>
<text x="331" y="184" text-anchor="middle" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">total / num_gastos</text>
<text x="547" y="184" text-anchor="middle" dominant-baseline="central" style="fill:#334155;font-size:11px;font-weight:600;">Calcular gasto medio</text>

<!-- Fila // -->
<rect x="20" y="202" width="640" height="28" rx="4" fill="#EDE9FE"/>
<text x="55" y="216" text-anchor="middle" dominant-baseline="central" style="fill:#0891B2;font-family:'Courier New',monospace;font-size:18px;font-weight:700;">//</text>
<text x="163" y="216" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">División entera</text>
<text x="331" y="216" text-anchor="middle" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">17 // 5  →  3</text>
<text x="547" y="216" text-anchor="middle" dominant-baseline="central" style="fill:#334155;font-size:11px;font-weight:600;">Resultado sin decimales</text>

<!-- Fila % -->
<rect x="20" y="234" width="640" height="28" rx="4" fill="#F5F3FF"/>
<text x="55" y="248" text-anchor="middle" dominant-baseline="central" style="fill:#0891B2;font-family:'Courier New',monospace;font-size:18px;font-weight:700;">%</text>
<text x="163" y="248" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">Módulo</text>
<text x="331" y="248" text-anchor="middle" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">17 % 5  →  2</text>
<text x="547" y="248" text-anchor="middle" dominant-baseline="central" style="fill:#334155;font-size:11px;font-weight:600;">Resto de la división</text>

<!-- Fila ** (potencia) -->
<rect x="20" y="266" width="640" height="28" rx="4" fill="#E0F2FE"/>
<text x="55" y="280" text-anchor="middle" dominant-baseline="central" style="fill:#0891B2;font-family:'Courier New',monospace;font-size:18px;font-weight:700;">**</text>
<text x="163" y="280" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">Potencia</text>
<text x="331" y="280" text-anchor="middle" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">2 ** 8  →  256</text>
<text x="547" y="280" text-anchor="middle" dominant-baseline="central" style="fill:#334155;font-size:11px;font-weight:600;">Elevar un número a una potencia</text>

<rect x="20" y="74" width="640" height="220" rx="4" fill="none" stroke="#BAE6FD" stroke-width="1"/>
</svg>
