<svg width="1380" height="700" viewBox="0 0 690 350" xmlns="http://www.w3.org/2000/svg" role="img">
<title>La función range() en Python</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap');
  * { font-family:'Poppins','Segoe UI',Arial,sans-serif; }
</style>

<rect width="680" height="340" fill="#F8FAFC" rx="12"/>
<rect x="0" y="0" width="680" height="36" rx="12" fill="#1E3A5F"/>
<rect x="0" y="24" width="680" height="12" fill="#1E3A5F"/>
<text x="340" y="14" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:15px;font-weight:700;">La función range() en Python</text>
<text x="340" y="28" text-anchor="middle" dominant-baseline="central" style="fill:#BAE6FD;font-size:10px;font-weight:600;">Genera secuencias de números para usar con el bucle for</text>

<!-- Cabecera columnas -->
<rect x="20" y="44" width="175" height="26" rx="6" fill="#0891B2"/>
<rect x="203" y="44" width="120" height="26" rx="6" fill="#0891B2"/>
<rect x="331" y="44" width="160" height="26" rx="6" fill="#0891B2"/>
<rect x="499" y="44" width="161" height="26" rx="6" fill="#0891B2"/>
<text x="107" y="57" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:12px;font-weight:700;">Uso</text>
<text x="263" y="57" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:12px;font-weight:700;">Sintaxis</text>
<text x="411" y="57" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:12px;font-weight:700;">Secuencia generada</text>
<text x="579" y="57" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:12px;font-weight:700;">Ejemplo con for</text>

<!-- Fila 1: range(n) -->
<rect x="20" y="74" width="640" height="44" rx="4" fill="#E0F2FE"/>
<text x="107" y="88" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">Desde 0 hasta n-1</text>
<text x="107" y="106" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">(un solo argumento)</text>
<text x="263" y="96" text-anchor="middle" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">range(5)</text>
<text x="411" y="96" text-anchor="middle" dominant-baseline="central" style="fill:#059669;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">0, 1, 2, 3, 4</text>
<text x="499" y="90" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">for i in range(5):</text>
<text x="519" y="108" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">print(i)</text>

<!-- Fila 2: range(inicio, fin) -->
<rect x="20" y="122" width="640" height="44" rx="4" fill="#FFFFFF"/>
<text x="107" y="136" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">Desde inicio hasta</text>
<text x="107" y="154" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">fin-1</text>
<text x="263" y="144" text-anchor="middle" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">range(1, 6)</text>
<text x="411" y="144" text-anchor="middle" dominant-baseline="central" style="fill:#059669;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">1, 2, 3, 4, 5</text>
<text x="499" y="138" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">for i in range(1,6):</text>
<text x="519" y="156" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">print(i)</text>

<!-- Fila 3: range(inicio, fin, paso) -->
<rect x="20" y="170" width="640" height="44" rx="4" fill="#E0F2FE"/>
<text x="107" y="184" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">Desde inicio hasta</text>
<text x="107" y="202" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">fin-1, de X en X</text>
<text x="263" y="192" text-anchor="middle" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">range(0,10,2)</text>
<text x="411" y="192" text-anchor="middle" dominant-baseline="central" style="fill:#059669;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">0, 2, 4, 6, 8</text>
<text x="499" y="186" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">for i in range(0,10,2):</text>
<text x="519" y="204" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">print(i)</text>

<!-- Fila 4: range inverso -->
<rect x="20" y="218" width="640" height="44" rx="4" fill="#FFFFFF"/>
<text x="107" y="232" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">Cuenta hacia atrás</text>
<text x="107" y="250" text-anchor="middle" dominant-baseline="central" style="fill:#0F172A;font-size:12px;font-weight:600;">(paso negativo)</text>
<text x="263" y="240" text-anchor="middle" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">range(5,0,-1)</text>
<text x="411" y="240" text-anchor="middle" dominant-baseline="central" style="fill:#059669;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">5, 4, 3, 2, 1</text>
<text x="499" y="234" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">for i in range(5,0,-1):</text>
<text x="519" y="252" dominant-baseline="central" style="fill:#1E3A5F;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">print(i)</text>

<rect x="20" y="74" width="640" height="188" rx="4" fill="none" stroke="#BAE6FD" stroke-width="1"/>

<!-- Footer -->
<rect x="20" y="276" width="640" height="52" rx="10" fill="#1E3A5F"/>
<text x="340" y="292" text-anchor="middle" dominant-baseline="central" style="fill:#FFFFFF;font-size:11px;font-weight:700;">Aplicado al Gestor de Gastos</text>
<text x="50" y="314" dominant-baseline="central" style="fill:#67E8F9;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">for i in range(1, 6):</text>
<text x="280" y="314" dominant-baseline="central" style="fill:#FFFFFF;font-family:'Courier New',monospace;font-size:11px;font-weight:700;">→</text>
<text x="310" y="314" dominant-baseline="central" style="fill:#FFFFFF;font-size:10px;font-weight:600;opacity:0.85;">Pide 5 gastos al usuario numerados del 1 al 5</text>
</svg>
